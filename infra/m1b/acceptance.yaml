run_bounds:
  agent: dfhack-governed-scripted
  memory_enabled: false
  max_steps: 20
  max_ticks_per_step: 200
  max_real_runtime_attempts: 26
  provider_calls: 0
  provider_cost_usd: 0

terminal_order:
  - terminal_pending_cleanup
  - evidence_snapshot_completed
  - harness_process_group_reaped
  - runtime_container_removed
  - cleanup_verified
  - cleanup_completed
  - immutable_terminal_classification

attempt_invariants:
  - every planned attempt has exactly one durable terminal classification
  - terminal classification occurs only after cleanup verification
  - Python is at least 3.11 and package installation is supported normally
  - image, seed, configuration, and code digests are exact
  - port has an exclusive supervisor lease before Docker or harness launch
  - RPC nonce, run identity, port, and seed attestation match
  - child environment equals the explicit allowlist and dotenv is disabled
  - provider routes and credentials are absent from scripted children
  - all attempted provider network connections are rejected and evidenced
  - control-plane evidence is outside the faulted run workspace

replacement_rule:
  maximum_per_logical_run: 1
  maximum_natural_startup_replacements_packet: 2
  maximum_natural_startup_replacements_co8: 1
  co8_minimum_ready_primaries: 7
  allowed_before_harness_started:
    - container_create_failure
    - rpc_readiness_timeout
    - map_readiness_timeout
  never_replace:
    - port_policy_failure
    - nonce_mismatch
    - cross_talk
    - provider_policy_breach
    - cleanup_residue
    - any_failure_after_harness_started
  injected_faults_are_replacements: false
  test_injector_invalid_reruns: 1

gates:
  - id: PORT-1
    class: local
    procedure: race 32 supervisor requests against one port lease
    pass:
      winners: 1
      durable_port_lease_conflicts: 31
      losers_start_runtime_or_harness: false

  - id: PORT-2
    class: real_runtime
    procedure: request an already leased and listening port while peer A remains ready
    pass:
      fail_closed_seconds_lte: 5
      second_runtime_started: false
      second_harness_started: false
      peer_nonce_and_rpc_unchanged: true

  - id: COLD-RETRY
    class: real_runtime
    procedure: suppress first RPC readiness in test mode, then retry exactly once
    pass:
      first_terminal: rpc_readiness_timeout
      first_cleanup_verified: true
      second_uses_fresh_identity_and_resources: true
      second_completes: true
      production_mode_accepts_fault_knob: false

  - id: CO-8
    class: isolated_x86_linux
    procedure: barrier-start eight fresh runtimes and eight harness processes
    pass:
      logical_runs_completed: 8
      seed_attestation_unique_count: 1
      distinct_ports_nonces_containers_pids_homes_saves_artifacts: true
      rpc_receipts_match_run_nonce: true
      symmetric_cotenancy_graph: true
      cross_run_artifact_references: 0

  - id: DF-KILL
    class: real_runtime
    procedure: SIGKILL target A Dwarf_Fortress after step 2 while peer B continues
    pass:
      target_terminal: runtime_df_killed
      target_oom_killed: false
      detection_seconds_lte: 10
      cleanup_seconds_lte: 30
      peer_minimum_step: 5
      peer_reconnected: false

  - id: HARNESS-KILL
    class: real_runtime
    procedure: SIGKILL target A harness after step 2 while leaving descendants
    pass:
      target_terminal: harness_killed
      target_process_group_reaped: true
      target_runtime_listener_and_lease_removed: true
      peer_minimum_step: 5

  - id: OOM
    class: isolated_x86_linux
    procedure: run target A at 256 MiB while peer B retains the normal cap
    pass:
      target_terminal: runtime_oom
      cgroup_memory_events_proves_oom: true
      target_memory_events_local_oom_kill_delta_gte: 1
      exit_137_alone_is_sufficient: false
      peer_healthy: true
      host_oom_counter_delta: 0
      host_oom_counter_definition: >-
        global_proc_vmstat_oom_kill_delta minus
        target_memory_events_local_oom_kill_delta

  - id: ENOSPC
    class: isolated_x86_linux
    procedure: fill only target A private 16 MiB workspace tmpfs at the step-2 barrier
    pass:
      target_terminal: workspace_enospc
      errno: 28
      control_plane_journal_survives: true
      peer_continues: true
      maximum_fault_bytes: 16777216

  - id: CONTAINER-RESTART
    class: real_runtime
    procedure: docker restart target A at step 2
    pass:
      target_terminal: runtime_container_restarted
      silent_reconnect: false
      peer_continues: true

  - id: DAEMON-RESTART
    class: isolated_x86_linux_host_controller
    procedure: restart Docker from outside Docker while two runs are active
    pass:
      affected_terminal: docker_daemon_restarted
      silent_continuation: false
      reconciliation_seconds_lte: 120
      supervisor_remains_operational: true

  - id: ORPHAN-1
    class: local_and_real_runtime
    procedure: reconcile managed orphans beside an unlabeled foreign canary
    pass:
      managed_orphans_removed: true
      foreign_canary_untouched: true
      second_reconciliation_noop: true

  - id: ORPHAN-2
    class: isolated_x86_linux
    procedure: SIGKILL supervisor during a run, then restart from durable journal
    pass:
      run_resumed: false
      target_terminal: supervisor_lost
      all_managed_resources_reaped: true

  - id: PROVIDER-ENV
    class: local
    procedure: launch from poisoned parent environment and poisoned temporary dotenv
    pass:
      child_environment_equals_allowlist: true
      poisoned_values_present: false
      dotenv_disabled: true
      agent: dfhack-governed-scripted

  - id: PROVIDER-NET
    class: isolated_x86_linux
    procedure: constrain harness network to assigned loopback RPC and capture connects
    pass:
      dns_connections: 0
      port_443_connections: 0
      poison_sink_connections: 0
      only_assigned_dfhack_connection: true
      provider_calls: 0
      provider_cost_usd: 0

  - id: CAP-FAKE
    class: local
    procedure: >-
      emit one synthetic provider usage event that exactly reaches a positive
      configured test cap, leaving zero remaining budget before a second dispatch
    pass:
      terminal: budget_cap_exceeded
      second_fake_call: false
      missing_cap_or_pin_rejected: true
      real_provider_or_network_used: false

  - id: CLEANUP
    class: every_case
    procedure: run scoped cleanup twice after every gate and after the final batch
    pass:
      exact_batch_containers_processes_listeners_leases_mounts_tempdirs: 0
      retained_evidence_allowed: true
      foreign_canary_untouched: true

decision_rule:
  go: every hard gate passes on the real runtime with complete evidence
  incomplete_no_go: >-
    local or mock success without CO-8, daemon restart, OOM, ENOSPC, provider
    network exclusion, and orphan recovery on isolated x86-64 Linux
