    type: measurement_definition_clarification
    gate: OOM
    scope: >-
      The frozen host_oom_counter_delta is the unexplained host OOM-kill
      delta: the global /proc/vmstat oom_kill delta minus the target cgroup's
      memory.events.local oom_kill delta. Linux increments the global VM event
      for an intended memory-cgroup OOM kill, so requiring the raw global
      counter itself to remain unchanged would contradict the required target
      OOM. The target-local cgroup delta must still be at least one, and no
      hierarchical memory.events value may substitute for memory.events.local.
    execution_state: before any real-runtime or injected OOM execution
    gate_changes: none
    threshold_changes: none
    outcome_dependent: false
